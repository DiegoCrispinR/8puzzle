<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Puzzle Game</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://pagead2.googlesyndication.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h1>8-Puzzle Game</h1>
        
        <div class="game-container">
            <div class="puzzle-container">
                <div class="puzzle-board" id="puzzle-board">
                    <!-- Tiles will be generated by JavaScript -->
                </div>
                
                <div class="controls">
                    <button id="shuffle-btn" class="btn">Barajear</button>
                    <button id="solve-btn" class="btn">Resolver</button>
                </div>
                
                <div class="move-counter">
                    <span>Movimientos: </span>
                    <span id="moves">0</span>
                </div>
                
                <div class="timer">
                    <span>Tiempo: </span>
                    <span id="time">00:00</span>
                </div>
            </div>
            
            <div class="scoreboard-container">
                <h2>Tabla de Puntuaciones</h2>
                <div class="scoreboard-header">
                    <span>Posición</span>
                    <span>Jugador</span>
                    <span>Movimientos</span>
                    <span>Tiempo</span>
                </div>
                <div id="scoreboard" class="scoreboard">
                    <!-- Scores will be generated by JavaScript -->
                </div>
                
                <div class="scoreboard-info">
                    <p>La tabla se actualiza semanalmente</p>
                    <p id="next-update"></p>
                </div>
            </div>
        </div>
        
        <!-- Ad container -->
        <div class="ad-container">
            <!-- Google AdSense Ad Unit -->
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="XXXXXXXXXX"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
        
        <!-- Player name modal -->
        <div id="name-modal" class="modal">
            <div class="modal-content">
                <h2>¡Felicidades!</h2>
                <p>Has completado el puzzle en <span id="final-moves">0</span> movimientos y <span id="final-time">00:00</span>.</p>
                <div class="input-group">
                    <label for="player-name">Ingresa tu nombre:</label>
                    <input type="text" id="player-name" maxlength="15" placeholder="Tu nombre">
                </div>
                <button id="save-score" class="btn">Guardar Puntuación</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
